# ==============================================
# SIRMaroc - Microservice Matchs
# Common configuration shared by all profiles
# ==============================================

spring.application.name=microservice-matchs
server.port=${SERVER_PORT:8083}

# ==============================================
# SQL Server Configuration
# ==============================================
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=sirmaroc_matchs;integratedSecurity=true;encrypt=true;trustServerCertificate=true}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.connection-test-query=SELECT 1

# ==============================================
# JPA / Hibernate
# ==============================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:dbo}

# ==============================================
# Flyway / Schema Migration
# ==============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=${DB_SCHEMA:dbo}
spring.flyway.baseline-on-migrate=true
spring.flyway.connect-retries=${FLYWAY_CONNECT_RETRIES:3}

# ==============================================
# CORS Configuration
# ==============================================
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.security.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.security.cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Gateway-Token,X-Authenticated-User,X-Authenticated-Roles}
app.security.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}

# ==============================================
# API Gateway Trust
# ==============================================
app.security.gateway.enabled=${GATEWAY_TRUST_ENABLED:true}
app.security.gateway.shared-secret=${GATEWAY_SHARED_SECRET:change-me-gateway-secret}
app.security.gateway.gateway-header-name=${GATEWAY_HEADER_NAME:X-Gateway-Token}
app.security.gateway.username-header-name=${GATEWAY_USER_HEADER_NAME:X-Authenticated-User}
app.security.gateway.roles-header-name=${GATEWAY_ROLES_HEADER_NAME:X-Authenticated-Roles}

# ==============================================
# SpringDoc / Swagger UI
# ==============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ==============================================
# Actuator
# ==============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_DETAILS:never}
management.health.db.enabled=true

# ==============================================
# Logging
# ==============================================
logging.level.ma.sirmaroc=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}

# ==============================================
# API-Football Integration
# ==============================================
app.api-football.enabled=${API_FOOTBALL_ENABLED:false}
app.api-football.base-url=${API_FOOTBALL_BASE_URL:https://v3.football.api-sports.io}
app.api-football.api-key=${API_FOOTBALL_API_KEY:}
app.api-football.timezone=${API_FOOTBALL_TIMEZONE:Africa/Casablanca}
